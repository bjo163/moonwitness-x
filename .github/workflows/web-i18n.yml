name: Web translation gate

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-i18n.yml"

jobs:
  translation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reject untranslated UI copy in changed files
        run: pnpm --filter ./apps/web lint:i18n
        env:
          I18N_BASE_REF: ${{ github.event.pull_request.base.sha }}
